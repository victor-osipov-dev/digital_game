<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Антисклероз</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #101014; touch-action: none; -webkit-user-select: none; user-select: none; }
    #canvas { width: 100%; height: 100%; display: block; outline: none; }
    /* Стартовый лоадер виден сразу, ещё до загрузки и запуска бандла. */
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #101014;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      transition: opacity 0.35s ease;
    }
    #boot-loader.is-hidden { opacity: 0; pointer-events: none; }
    .boot-title { color: #FFD54F; font-size: clamp(24px, 5vw, 38px); font-weight: bold; letter-spacing: 0.02em; }
    .boot-spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(255, 213, 79, 0.22);
      border-top-color: #FFD54F;
      animation: boot-spin 0.9s linear infinite;
    }
    .boot-text { color: #9A9BA8; font-size: 15px; letter-spacing: 0.04em; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .boot-spinner { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="boot-loader" role="status" aria-live="polite">
    <div class="boot-title" id="boot-title">Антисклероз</div>
    <div class="boot-spinner"></div>
    <div class="boot-text" id="boot-text">Загрузка…</div>
  </div>
  <script>
    // Язык лоадера совпадает с сохранённым языком игры (до запуска бандла).
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('dg.settings') || '{}');
        if (s && s.lang === 'en') {
          document.getElementById('boot-title').textContent = 'Anti-Sclerosis';
          document.getElementById('boot-text').textContent = 'Loading…';
        }
      } catch (e) { /* localStorage недоступен — оставляем русский */ }
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
